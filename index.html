<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Glow Buddies — Inclusive v3</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet" />

<style>

  body {

    font-family: 'Quicksand', sans-serif;

    transition: background 0.5s ease, color 0.5s ease;

  }

  .game-tile {

    cursor: pointer;

    font-size: 2rem;

    background: rgba(255,255,255,0.8);

    border-radius: 0.75rem;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    transition: transform 0.2s ease, box-shadow 0.3s ease, background 0.3s ease, color 0.3s ease;

  }

  .game-tile:hover {

    transform: scale(1.05);

  }

  .active-glow {

    box-shadow: 0 0 30px 10px rgba(255, 255, 255, 0.7);

    transform: scale(1.1);

  }

  .bg-grass { background: linear-gradient(#a7f3d0, #34d399); }

  .bg-space { background: linear-gradient(#0f172a, #1e40af); }

  .bg-beach { background: linear-gradient(#fde68a, #fcd34d); }

  .bg-fruit { background: linear-gradient(#fca5a5, #f87171); }

  .contrast-on {

    background: #000 !important;

    color: #fff !important;

  }

  .contrast-on .game-tile {

    background: #333 !important;

    color: #ff0 !important;

  }

</style>

</head>

<body class="bg-grass flex items-center justify-center min-h-screen">

<div class="max-w-xl p-4 w-full text-center text-white">

  <h1 class="text-4xl font-bold mb-2">🌟 Glow Buddies</h1>

  <p class="mb-4 text-lg">Inclusive Memory Game — Themes, Rewards & Aids</p>



  <div class="mb-4 space-x-1 text-sm">

    <button id="startBtn" class="px-2 py-1 bg-green-500 rounded">Start</button>

    <select id="themeSelect" class="px-1 py-1 rounded text-black">

      <option value="grass">🌾 Grass</option>

      <option value="space">🌌 Space</option>

      <option value="beach">🏖️ Beach</option>

      <option value="fruit">🍉 Fruit</option>

    </select>

    <button id="contrastBtn" class="px-1 py-1 bg-gray-200 text-black rounded">Contrast</button>

    <button id="soundBtn" class="px-1 py-1 bg-gray-200 text-black rounded">Sound: On</button>

    <button id="calmBtn" class="px-1 py-1 bg-gray-200 text-black rounded">Calm: Off</button>

  </div>



  <div id="score" class="mb-2 text-xl">Score: 0</div>

  <div id="message" class="mb-4 text-lg">Press Start to begin</div>



  <div id="board" class="grid grid-cols-2 gap-4 max-w-sm mx-auto">

    <div class="game-tile" data-id="0"><div>🐶</div><div class="text-xs">Dog</div></div>

    <div class="game-tile" data-id="1"><div>🐱</div><div class="text-xs">Cat</div></div>

    <div class="game-tile" data-id="2"><div>🐰</div><div class="text-xs">Rabbit</div></div>

    <div class="game-tile" data-id="3"><div>🦊</div><div class="text-xs">Fox</div></div>

  </div>

</div>



<script>

const startBtn = document.getElementById('startBtn');

const board = document.getElementById('board');

const message = document.getElementById('message');

const tiles = document.querySelectorAll('.game-tile');

const themeSelect = document.getElementById('themeSelect');

const contrastBtn = document.getElementById('contrastBtn');

const soundBtn = document.getElementById('soundBtn');

const calmBtn = document.getElementById('calmBtn');

const scoreElem = document.getElementById('score');

const body = document.body;



const sounds = ['C4', 'E4', 'G4', 'B4'];

let sequence = [], playerSequence = [], level = 0, turn = false;

let score = 0, soundOn = true, calmMode = false;



const synths = [new Tone.Synth().toDestination(), new Tone.Synth().toDestination(),

  new Tone.Synth().toDestination(), new Tone.Synth().toDestination()];



const themes = {

  grass: [['🐶','Dog'],['🐱','Cat'],['🐰','Rabbit'],['🦊','Fox']],

  space: [['🪐','Planet'],['👽','Alien'],['🚀','Rocket'],['🌟','Star']],

  beach: [['🐚','Shell'],['🦀','Crab'],['🏝️','Island'],['🌊','Wave']],

  fruit: [['🍎','Apple'],['🍌','Banana'],['🍇','Grapes'],['🍉','Watermelon']]

};



themeSelect.addEventListener('change', () => {

  const theme = themeSelect.value;

  body.className = `bg-${theme} flex items-center justify-center min-h-screen${body.classList.contains('contrast-on') ? ' contrast-on' : ''}`;

  tiles.forEach((tile, i) => {

    tile.children[0].textContent = themes[theme][i][0];

    tile.children[1].textContent = themes[theme][i][1];

  });

});



contrastBtn.addEventListener('click', () => {

  body.classList.toggle('contrast-on');

});



soundBtn.addEventListener('click', () => {

  soundOn = !soundOn;

  soundBtn.textContent = `Sound: ${soundOn ? 'On' : 'Off'}`;

});



calmBtn.addEventListener('click', () => {

  calmMode = !calmMode;

  calmBtn.textContent = `Calm: ${calmMode ? 'On' : 'Off'}`;

});



function sleep(ms) {

  return new Promise(res => setTimeout(res, ms));

}



async function startGame() {

  sequence = [];

  playerSequence = [];

  level = 0;

  score = 0;

  updateScore();

  startBtn.disabled = true;

  nextLevel();

}



function updateScore() {

  scoreElem.textContent = `Score: ${score}`;

}



async function nextLevel() {

  turn = false;

  playerSequence = [];

  level++;

  score += 10;

  updateScore();

  message.textContent = `Level ${level}`;

  sequence.push(Math.floor(Math.random() * 4));  // add new random

  await playSequence();

  turn = true;

  message.textContent = `Your turn!`;

}



async function playSequence() {

  for (const idx of sequence) {

    await glowTile(idx);

    await sleep(calmMode ? 700 : 300);

  }

}



async function glowTile(idx) {

  tiles[idx].classList.add('active-glow');

  if (soundOn) synths[idx].triggerAttackRelease(sounds[idx], '8n');

  await sleep(calmMode ? 700 : 400);

  tiles[idx].classList.remove('active-glow');

}



board.addEventListener('click', async (e) => {

  if (!turn) return;

  const tile = e.target.closest('.game-tile');

  if (!tile) return;



  const id = parseInt(tile.dataset.id);

  await glowTile(id);

  playerSequence.push(id);



  const i = playerSequence.length - 1;

  if (playerSequence[i] !== sequence[i]) {

    message.textContent = `Wrong! Final Score: ${score}`;

    startBtn.disabled = false;

    turn = false;

    return;

  }



  if (playerSequence.length === sequence.length) {

    await sleep(500);

    nextLevel();

  }

});



startBtn.addEventListener('click', () => {

  Tone.start();

  startGame();

});

</script>

</body>

</html>

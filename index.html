<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Glow Buddies — Inclusive & Themed</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet" />
<style>
  body {
    font-family: 'Quicksand', sans-serif;
    transition: background 0.5s ease;
  }
  .game-tile {
    cursor: pointer;
    font-size: 2.2rem;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease;
  }
  .game-tile:hover {
    transform: scale(1.05);
  }
  .active-glow {
    box-shadow: 0 0 20px 5px #6ee7b7;
    transform: scale(1.1);
  }
  .high-contrast .game-tile {
    background: #000;
    color: #fff;
  }
  .theme-grass {
    background: url('https://images.unsplash.com/photo-1601233744376-9b2f5b61e91a?&w=1600&q=80') center/cover no-repeat;
  }
  .theme-space {
    background: url('https://images.unsplash.com/photo-1454789548928-9efd52dc4031?&w=1600&q=80') center/cover no-repeat;
  }
  .theme-beach {
    background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?&w=1600&q=80') center/cover no-repeat;
  }
  .theme-fruit {
    background: url('https://images.unsplash.com/photo-1560807707-8cc77767d783?&w=1600&q=80') center/cover no-repeat;
  }
</style>
</head>
<body class="theme-grass flex items-center justify-center min-h-screen">
<div class="max-w-2xl p-4 w-full text-center">
  <h1 class="text-4xl font-bold mb-2">🌟 Glow Buddies</h1>
  <p class="mb-4 text-lg">Memory Game — Inclusive & Themed</p>

  <div class="mb-4 space-x-2">
    <button id="startBtn" class="px-4 py-2 bg-green-500 text-white rounded">Start</button>
    <select id="themeSelect" class="px-2 py-1 rounded border">
      <option value="grass">🌾 Grass</option>
      <option value="space">🌌 Space</option>
      <option value="beach">🏖️ Beach</option>
      <option value="fruit">🍉 Fruit</option>
    </select>
    <button id="contrastBtn" class="px-2 py-1 bg-gray-300 rounded">Contrast</button>
    <button id="soundBtn" class="px-2 py-1 bg-gray-300 rounded">Sound: On</button>
    <button id="calmBtn" class="px-2 py-1 bg-gray-300 rounded">Calm: Off</button>
  </div>

  <div id="message" class="mb-4 text-xl"></div>

  <div id="board" class="grid grid-cols-2 gap-4 max-w-md mx-auto">
    <div class="game-tile" data-id="0">🐶</div>
    <div class="game-tile" data-id="1">🐱</div>
    <div class="game-tile" data-id="2">🐰</div>
    <div class="game-tile" data-id="3">🦊</div>
  </div>
</div>

<script>
const startBtn = document.getElementById('startBtn');
const board = document.getElementById('board');
const message = document.getElementById('message');
const tiles = document.querySelectorAll('.game-tile');
const themeSelect = document.getElementById('themeSelect');
const contrastBtn = document.getElementById('contrastBtn');
const soundBtn = document.getElementById('soundBtn');
const calmBtn = document.getElementById('calmBtn');
const body = document.body;

const sounds = ['C4', 'E4', 'G4', 'B4'];
let sequence = [], playerSequence = [], level = 0, turn = false;
let soundOn = true, calmMode = false;

const synths = [new Tone.Synth().toDestination(), new Tone.Synth().toDestination(),
  new Tone.Synth().toDestination(), new Tone.Synth().toDestination()];

const themes = {
  grass: ['🐶', '🐱', '🐰', '🦊'],
  space: ['🪐', '👽', '🚀', '🌟'],
  beach: ['🐚', '🦀', '🏝️', '🌊'],
  fruit: ['🍎', '🍌', '🍇', '🍉']
};

themeSelect.addEventListener('change', () => {
  const theme = themeSelect.value;
  body.className = `theme-${theme} flex items-center justify-center min-h-screen`;
  tiles.forEach((tile, i) => tile.textContent = themes[theme][i]);
});

contrastBtn.addEventListener('click', () => {
  body.classList.toggle('high-contrast');
});

soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  soundBtn.textContent = `Sound: ${soundOn ? 'On' : 'Off'}`;
});

calmBtn.addEventListener('click', () => {
  calmMode = !calmMode;
  calmBtn.textContent = `Calm: ${calmMode ? 'On' : 'Off'}`;
});

function sleep(ms) {
  return new Promise(res => setTimeout(res, ms));
}

async function startGame() {
  sequence = [];
  level = 0;
  startBtn.disabled = true;
  nextLevel();
}

async function nextLevel() {
  turn = false;
  playerSequence = [];
  level++;
  message.textContent = `Level ${level}`;
  sequence.push(Math.floor(Math.random() * 4));
  await playSequence();
  turn = true;
  message.textContent = `Your turn!`;
}

async function playSequence() {
  for (const idx of sequence) {
    await glowTile(idx);
    await sleep(calmMode ? 600 : 300);
  }
}

async function glowTile(idx) {
  tiles[idx].classList.add('active-glow');
  if (soundOn) synths[idx].triggerAttackRelease(sounds[idx], '8n');
  await sleep(calmMode ? 700 : 400);
  tiles[idx].classList.remove('active-glow');
}

board.addEventListener('click', async (e) => {
  if (!turn) return;
  const id = parseInt(e.target.dataset.id);
  if (isNaN(id)) return;

  await glowTile(id);
  playerSequence.push(id);

  const i = playerSequence.length - 1;
  if (playerSequence[i] !== sequence[i]) {
    message.textContent = 'Wrong! Try again!';
    startBtn.disabled = false;
    turn = false;
    return;
  }

  if (playerSequence.length === sequence.length) {
    await sleep(500);
    nextLevel();
  }
});

startBtn.addEventListener('click', () => {
  Tone.start();
  startGame();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Glow Buddies — Inclusive v3</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet" />

<style>
  body {
    font-family: 'Quicksand', sans-serif;
    transition: background 0.5s ease, color 0.5s ease;
  }

  .game-tile {
    cursor: pointer;
    font-size: 2.5rem;
    background: rgba(255,255,255,0.85);
    border-radius: 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100px;
    transition: transform 0.2s ease, box-shadow 0.3s ease, background 0.3s ease, color 0.3s ease;
  }

  .game-tile:hover {
    transform: scale(1.05);
  }

  .active-glow {
    box-shadow: 0 0 30px 10px rgba(255, 255, 255, 0.7);
    transform: scale(1.1);
  }

  .bg-grass { background: linear-gradient(#a7f3d0, #34d399); }
  .bg-space { background: linear-gradient(#0f172a, #1e40af); }
  .bg-beach { background: linear-gradient(#fde68a, #fcd34d); }
  .bg-fruit { background: linear-gradient(#fca5a5, #f87171); }

  .contrast-on {
    background: #000 !important;
    color: #fff !important;
  }

  .contrast-on .game-tile {
    background: #333 !important;
    color: #ff0 !important;
  }
</style>
</head>

<body class="bg-grass flex items-center justify-center min-h-screen">
<div class="max-w-xl p-4 w-full text-center text-white space-y-4">

  <h1 class="text-5xl font-bold">🌟 Glow Buddies</h1>
  <p class="text-xl">Inclusive Memory Game — Themes, Rewards & Aids</p>

  <div class="flex flex-wrap justify-center gap-2">
    <button id="startBtn" class="px-3 py-2 bg-green-500 rounded text-base">Start</button>

    <select id="themeSelect" class="px-2 py-2 rounded text-black text-base">
      <option value="grass">🌾 Grass</option>
      <option value="space">🌌 Space</option>
      <option value="beach">🏖️ Beach</option>
      <option value="fruit">🍉 Fruit</option>
    </select>

    <button id="contrastBtn" class="px-3 py-2 bg-gray-200 text-black rounded text-base">Contrast</button>
    <button id="soundBtn" class="px-3 py-2 bg-gray-200 text-black rounded text-base">Sound: On</button>
    <button id="calmBtn" class="px-3 py-2 bg-gray-200 text-black rounded text-base">Calm: Off</button>
  </div>

  <div id="score" class="text-2xl font-semibold">Score: 0</div>
  <div id="message" class="text-lg">Press Start to begin</div>

  <div id="board" class="grid grid-cols-2 gap-6 max-w-sm mx-auto">
    <div class="game-tile" data-id="0"><div>🐶</div><div class="text-sm">Dog</div></div>
    <div class="game-tile" data-id="1"><div>🐱</div><div class="text-sm">Cat</div></div>
    <div class="game-tile" data-id="2"><div>🐰</div><div class="text-sm">Rabbit</div></div>
    <div class="game-tile" data-id="3"><div>🦊</div><div class="text-sm">Fox</div></div>
  </div>
</div>

<script>
// your original script stays unchanged
</script>
</body>
</html>

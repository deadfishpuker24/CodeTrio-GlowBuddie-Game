<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glow Buddies - Inclusive</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
<style>
body {
  font-family: Quicksand, sans-serif;
}
.bg-grass { background: #b7e4c7; }
.bg-space { background: #1e3a8a; color: white; }
.bg-beach { background: #fcd5ce; }
.bg-fruit { background: #ffe5b4; }
.contrast-on { filter: contrast(1.5); }
.game-tile {
  font-size: 2rem;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  text-shadow: 0 0 3px #000, 0 0 3px #000;
}
.game-tile:hover {
  transform: scale(1.05);
}
.active-glow {
  box-shadow: 0 0 20px 8px #fff;
  transform: scale(1.1);
}
</style>
</head>
<body class="bg-grass flex items-center justify-center min-h-screen">

<div class="text-center space-y-4">
  <h1 class="text-4xl font-bold">🌟 Glow Buddies</h1>
  <p id="message" class="text-xl">Press Start to play!</p>
  <button id="startBtn" class="px-6 py-2 bg-blue-500 text-white rounded shadow">Start</button>
  <div id="score" class="text-lg">Score: 0</div>

  <div class="grid grid-cols-2 gap-4 max-w-xs mx-auto mt-4" id="board">
    <div class="game-tile bg-yellow-300 rounded p-6" data-id="0">
      <div>🐶</div><div>Dog</div>
    </div>
    <div class="game-tile bg-green-300 rounded p-6" data-id="1">
      <div>🐱</div><div>Cat</div>
    </div>
    <div class="game-tile bg-pink-300 rounded p-6" data-id="2">
      <div>🐰</div><div>Rabbit</div>
    </div>
    <div class="game-tile bg-purple-300 rounded p-6" data-id="3">
      <div>🦊</div><div>Fox</div>
    </div>
  </div>

  <div class="space-x-2 mt-4">
    <select id="themeSelect" class="p-1 border rounded">
      <option value="grass">Grass</option>
      <option value="space">Space</option>
      <option value="beach">Beach</option>
      <option value="fruit">Fruit</option>
    </select>
    <button id="contrastBtn" class="px-2 py-1 bg-gray-300 rounded">High Contrast</button>
    <button id="soundBtn" class="px-2 py-1 bg-gray-300 rounded">Sound: On</button>
    <button id="calmBtn" class="px-2 py-1 bg-gray-300 rounded">Calm: Off</button>
  </div>
</div>

<script>
const startBtn = document.getElementById('startBtn');
const board = document.getElementById('board');
const message = document.getElementById('message');
const tiles = document.querySelectorAll('.game-tile');
const themeSelect = document.getElementById('themeSelect');
const contrastBtn = document.getElementById('contrastBtn');
const soundBtn = document.getElementById('soundBtn');
const calmBtn = document.getElementById('calmBtn');
const scoreElem = document.getElementById('score');
const body = document.body;

const rewardsDiv = document.createElement('div');
rewardsDiv.className = "mt-2 text-sm";
rewardsDiv.innerHTML = `🏅 Badges: <span id="badges"></span>`;
scoreElem.after(rewardsDiv);
const badgesSpan = document.getElementById('badges');

const sounds = ['C4', 'E4', 'G4', 'B4'];
let sequence = [], playerSequence = [], level = 0, turn = false;
let score = 0, soundOn = true, calmMode = false;
let badges = [];

const synths = [new Tone.Synth().toDestination(), new Tone.Synth().toDestination(),
  new Tone.Synth().toDestination(), new Tone.Synth().toDestination()];

const themes = {
  grass: [['🐶','Dog'],['🐱','Cat'],['🐰','Rabbit'],['🦊','Fox']],
  space: [['🪐','Planet'],['👽','Alien'],['🚀','Rocket'],['🌟','Star']],
  beach: [['🐚','Shell'],['🦀','Crab'],['🏝️','Island'],['🌊','Wave']],
  fruit: [['🍎','Apple'],['🍌','Banana'],['🍇','Grapes'],['🍉','Watermelon']]
};

tiles.forEach(tile => {
  tile.children[1].style.textShadow = "0 0 3px #000, 0 0 3px #000";
});

themeSelect.addEventListener('change', () => {
  const theme = themeSelect.value;
  body.className = `bg-${theme} flex items-center justify-center min-h-screen${body.classList.contains('contrast-on') ? ' contrast-on' : ''}`;
  tiles.forEach((tile, i) => {
    tile.children[0].textContent = themes[theme][i][0];
    tile.children[1].textContent = themes[theme][i][1];
  });
});

contrastBtn.addEventListener('click', () => {
  body.classList.toggle('contrast-on');
});

soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  soundBtn.textContent = `Sound: ${soundOn ? 'On' : 'Off'}`;
});

calmBtn.addEventListener('click', () => {
  calmMode = !calmMode;
  calmBtn.textContent = `Calm: ${calmMode ? 'On' : 'Off'}`;
});

function sleep(ms) {
  return new Promise(res => setTimeout(res, ms));
}

async function startGame() {
  sequence = [];
  playerSequence = [];
  level = 0;
  score = 0;
  badges = [];
  badgesSpan.textContent = "";
  updateScore();
  startBtn.disabled = true;
  nextLevel();
}

function updateScore() {
  scoreElem.textContent = `Score: ${score}`;
  if (score > 0 && score % 50 === 0) awardBadge();
}

function awardBadge() {
  const badgeEmojis = ['🥇','🥈','🥉','🏅','🎖️','🏆'];
  const badge = badgeEmojis[(badges.length) % badgeEmojis.length];
  badges.push(badge);
  badgesSpan.textContent = badges.join(' ');
  const popup = document.createElement('div');
  popup.textContent = `🎉 Reward earned: ${badge}`;
  popup.className = 'fixed top-4 left-1/2 transform -translate-x-1/2 bg-yellow-300 text-black px-4 py-2 rounded shadow-lg z-50';
  document.body.appendChild(popup);
  setTimeout(() => popup.remove(), 2000);
}

async function nextLevel() {
  turn = false;
  playerSequence = [];
  level++;
  score += 10;
  updateScore();
  message.textContent = `Level ${level}`;
  sequence.push(Math.floor(Math.random() * 4));
  await playSequence();
  turn = true;
  message.textContent = `Your turn!`;
}

async function playSequence() {
  for (const idx of sequence) {
    await glowTile(idx);
    await sleep(calmMode ? 700 : 300);
  }
}

async function glowTile(idx) {
  tiles[idx].classList.add('active-glow');
  if (soundOn) synths[idx].triggerAttackRelease(sounds[idx], '8n');
  await sleep(calmMode ? 700 : 400);
  tiles[idx].classList.remove('active-glow');
}

board.addEventListener('click', async (e) => {
  if (!turn) return;
  const tile = e.target.closest('.game-tile');
  if (!tile) return;

  const id = parseInt(tile.dataset.id);
  await glowTile(id);
  playerSequence.push(id);

  const i = playerSequence.length - 1;
  if (playerSequence[i] !== sequence[i]) {
    message.textContent = `Wrong! Final Score: ${score}`;
    startBtn.disabled = false;
    turn = false;
    return;
  }

  if (playerSequence.length === sequence.length) {
    await sleep(500);
    nextLevel();
  }
});

startBtn.addEventListener('click', () => {
  Tone.start();
  startGame();
});
</script>

</body>
</html>
